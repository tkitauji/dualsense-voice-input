name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build DualSenseVoice.sln -c Release --nologo
      - name: Build Bluetooth diagnostics
        run: |
          dotnet build tools/DualSenseBluetoothProbe/DualSenseBluetoothProbe.csproj -c Release --nologo
          dotnet build tools/DualSenseEndToEndTest/DualSenseEndToEndTest.csproj -c Release --nologo
      - name: Create development MSIX
        shell: pwsh
        run: ./build-msix.ps1
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseVoice-dev-msix
          path: artifacts/package/*.msix

