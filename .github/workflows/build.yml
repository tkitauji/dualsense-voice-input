name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build DualSenseVoice.sln -c Release --nologo
      - name: Build and run diagnostics
        run: |
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./run-coexistence-test.ps1)) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./run-usb-test.ps1)) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./run-accessibility-test.ps1)) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./run-wack.ps1)) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./run-store-preflight.ps1)) | Out-Null"
          dotnet build tools/DualSenseBluetoothProbe/DualSenseBluetoothProbe.csproj -c Release --nologo
          dotnet build tools/DualSenseEndToEndTest/DualSenseEndToEndTest.csproj -c Release --nologo
          dotnet build tools/GameInputInterferenceProbe/GameInputInterferenceProbe.csproj -c Release --nologo
          dotnet build tools/DualSenseUsbHardwareProbe/DualSenseUsbHardwareProbe.csproj -c Release --nologo
          dotnet run --project tools/DualSenseProtocolSelfTest/DualSenseProtocolSelfTest.csproj -c Release
          dotnet run --project tools/DualSenseUiSelfTest/DualSenseUiSelfTest.csproj -c Release -- artifacts/ui-self-test.png
      - name: Create development MSIX
        shell: pwsh
        run: |
          ./build-msix.ps1
          ./run-store-preflight.ps1 -Mode Development
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseVoice-dev-msix
          path: artifacts/package/*.msix
